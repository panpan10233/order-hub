<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrderHub · 多平台订单数据中台</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- ============ Sidebar ============ -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/>
          </svg>
        </div>
        <div class="brand-text">
          <strong>OrderHub</strong>
          <span>多平台订单中台</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <div class="nav-group-label">工作台</div>
        <button class="nav-item active" data-page="dashboard">
          <svg viewBox="0 0 24 24" class="ico"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>数据总览</span>
        </button>
        <button class="nav-item" data-page="platforms">
          <svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>
          <span>平台接入</span>
          <span class="nav-badge" id="navPlatformCount">6</span>
        </button>

        <div class="nav-group-label">业务中心</div>
        <button class="nav-item" data-page="orders">
          <svg viewBox="0 0 24 24" class="ico"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h7M9 17h7"/></svg>
          <span>订单中心</span>
        </button>
        <button class="nav-item" data-page="sync">
          <svg viewBox="0 0 24 24" class="ico"><path d="M21 12a9 9 0 0 1-15 6.7L3 16M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5M3 21v-5h5"/></svg>
          <span>同步中心</span>
          <span class="nav-dot" id="navSyncDot"></span>
        </button>
        <button class="nav-item" data-page="erp">
          <svg viewBox="0 0 24 24" class="ico"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>
          <span>ERP 对接</span>
        </button>
        <button class="nav-item" data-page="wms">
          <svg viewBox="0 0 24 24" class="ico"><path d="M3 21V8l9-5 9 5v13"/><path d="M3 21h18M8 21v-7h8v7M8 10h.01M12 10h.01M16 10h.01"/></svg>
          <span>WMS 库存</span>
          <span class="nav-badge warn" id="navWmsCount">0</span>
        </button>

        <div class="nav-group-label">洞察与配置</div>
        <button class="nav-item" data-page="analytics">
          <svg viewBox="0 0 24 24" class="ico"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          <span>数据分析</span>
        </button>
        <button class="nav-item" data-page="settings">
          <svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7.1 19.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 13.9H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 7.1l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10.3 3H10a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          <span>系统设置</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="sys-status"><span class="pulse"></span> 系统运行正常</div>
        <div class="sys-version">OrderHub v1.0 · Data Middle Platform</div>
      </div>
    </aside>

    <!-- ============ Main ============ -->
    <div class="main-wrap">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn mobile-menu" id="mobileMenu" aria-label="菜单">
            <svg viewBox="0 0 24 24" class="ico"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div class="page-title">
            <h1 id="pageTitle">数据总览</h1>
            <p id="pageSubtitle">全平台订单与库存的实时经营视图</p>
          </div>
        </div>
        <div class="topbar-right">
          <div class="top-search">
            <svg viewBox="0 0 24 24" class="ico"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input id="globalSearch" placeholder="搜索订单号 / SKU / 平台…" />
          </div>
          <button class="icon-btn" id="refreshBtn" title="刷新数据">
            <svg viewBox="0 0 24 24" class="ico"><path d="M21 12a9 9 0 0 1-15 6.7L3 16M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5M3 21v-5h5"/></svg>
          </button>
          <button class="icon-btn has-dot" id="bellBtn" title="通知">
            <svg viewBox="0 0 24 24" class="ico"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9z"/><path d="M10 21h4"/></svg>
          </button>
          <div class="avatar" title="管理员">AD</div>
        </div>
      </header>

      <main class="content" id="content"></main>
    </div>
  </div>

  <!-- ============ Overlays ============ -->
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <div><h3 id="drawerTitle">详情</h3><p id="drawerSubtitle"></p></div>
      <button class="icon-btn" id="drawerClose"><svg viewBox="0 0 24 24" class="ico"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-foot" id="drawerFoot"></div>
  </aside>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-head"><h3 id="modalTitle">操作</h3><button class="icon-btn" id="modalClose"><svg viewBox="0 0 24 24" class="ico"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>

  <!-- ============ AI Assistant ============ -->
  <button class="ai-fab" id="aiFab" title="智能助手">
    <svg viewBox="0 0 24 24" class="ico"><path d="M12 3a6 6 0 0 0-6 6c0 2.2 1.2 3.6 2.4 4.8L9 16h6l.6-2.2C16.8 12.6 18 11.2 18 9a6 6 0 0 0-6-6z"/><path d="M9 20h6M10 22h4"/></svg>
    <span class="ai-fab-dot"></span>
  </button>
  <section class="ai-panel" id="aiPanel">
    <div class="ai-head">
      <div class="ai-head-l"><div class="ai-avatar"><svg viewBox="0 0 24 24" class="ico"><path d="M12 3a6 6 0 0 0-6 6c0 2.2 1.2 3.6 2.4 4.8L9 16h6l.6-2.2C16.8 12.6 18 11.2 18 9a6 6 0 0 0-6-6z"/><path d="M9 20h6"/></svg></div><div><strong>OrderHub 智能助手</strong><span id="aiMode">基于中台实时数据</span></div></div>
      <button class="icon-btn" id="aiClose"><svg viewBox="0 0 24 24" class="ico"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="ai-msgs" id="aiMsgs"></div>
    <div class="ai-quick" id="aiQuick"></div>
    <div class="ai-input-wrap">
      <input id="aiInput" placeholder="问我订单、库存、同步情况…" />
      <button class="ai-send" id="aiSend"><svg viewBox="0 0 24 24" class="ico"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
    </div>
  </section>

  <div class="toast-wrap" id="toastWrap"></div>

  <script src="app.js"></script>
</body>
</html>
